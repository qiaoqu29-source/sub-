<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ Subliminal Studio Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0a12;
    --surface: #13101c;
    --surface2: #1a1525;
    --border: rgba(200,170,255,0.12);
    --accent: #c8a8ff;
    --accent2: #f0c0e8;
    --accent3: #8fd0ff;
    --text: #e8e0f5;
    --muted: rgba(232,224,245,0.45);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    position: relative;
    line-height: 1.5;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 20% 10%, rgba(120,80,200,0.15) 0%, transparent 60%);
    z-index: -1;
  }

  .container { max-width: 680px; margin: 0 auto; padding: 60px 24px; }
  header { text-align: center; margin-bottom: 48px; }
  h1 { font-family: 'Cormorant Garamond', serif; font-size: 48px; font-weight: 300; background: linear-gradient(135deg, var(--accent), var(--accent3)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 32px; margin-bottom: 20px; }
  .card-label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 16px; display: block; opacity: 0.7; }

  /* Upload */
  .upload-zone { border: 1.5px dashed rgba(200,168,255,0.2); border-radius: 12px; padding: 40px; text-align: center; cursor: pointer; transition: 0.3s; }
  .upload-zone:hover { border-color: var(--accent); background: rgba(200,168,255,0.03); }
  #fileInput { display: none; }
  .file-name { color: var(--accent2); margin-top: 10px; font-style: italic; }

  /* Controls */
  .controls-grid { display: grid; gap: 24px; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 8px; }

  .pitch-row { display: flex; align-items: center; gap: 12px; }
  .num-input {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--accent);
    width: 80px;
    font-size: 16px;
  }

  .mode-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mode-btn {
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: 0.3s;
  }
  .mode-btn.active { border-color: var(--accent); background: rgba(200,168,255,0.1); color: var(--accent); }

  .slider-value { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: var(--accent); }
  input[type="range"] { width: 100%; height: 4px; accent-color: var(--accent); cursor: pointer; }

  /* Action Button */
  .process-btn {
    width: 100%; padding: 16px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(180,130,255,0.2), rgba(100,170,255,0.1));
    border: 1px solid rgba(200,168,255,0.4);
    color: var(--accent); font-size: 18px; cursor: pointer; transition: 0.3s;
  }
  .process-btn:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--accent); }
  .process-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .progress-area { display: none; margin-top: 20px; text-align: center; }
  .progress-bar { height: 2px; background: rgba(200,168,255,0.1); margin-bottom: 10px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s; }

  .download-area { display: none; text-align: center; margin-top: 20px; }
  .download-btn {
    display: inline-block; padding: 12px 30px; border-radius: 50px;
    background: var(--accent); color: var(--bg); text-decoration: none; font-weight: 500;
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Subliminal Studio</h1>
    <p style="color:var(--muted)">频率调校与潜意识叠加工具</p>
  </header>

  <div class="card">
    <span class="card-label">01 上传音频</span>
    <div class="upload-zone" id="uploadZone">
      <input type="file" id="fileInput" accept="audio/*">
      <p>点击选择音频文件</p>
      <p class="file-name" id="fileName"></p>
    </div>
  </div>

  <div class="card">
    <span class="card-label">02 参数调节</span>
    <div class="controls-grid">
      
      <div>
        <label>音调调整 (半音)</label>
        <div class="pitch-row">
          <input type="number" id="pitchShift" class="num-input" value="0" step="1">
          <span style="font-size:12px; color:var(--muted)">正数调高，负数调低 (12为一八度)</span>
        </div>
      </div>

      <div>
        <label>重复次数: <span class="slider-value" id="repeatVal">10</span></label>
        <input type="range" id="repeatSlider" min="1" max="100" value="10" oninput="document.getElementById('repeatVal').innerText=this.value">
      </div>

      <div>
        <label>模式</label>
        <div class="mode-toggle">
          <button class="mode-btn active" id="btnConcat" onclick="changeMode('concat')">顺序拼接</button>
          <button class="mode-btn" id="btnOverlay" onclick="changeMode('overlay')">同步叠加</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <span class="card-label">03 生成结果</span>
    <button class="process-btn" id="processBtn" disabled onclick="startProcessing()">开始处理音频</button>
    
    <div class="progress-area" id="progressArea">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <p id="progressText" style="font-size:12px; color:var(--muted)">处理中...</p>
    </div>

    <div class="download-area" id="downloadArea">
      <a class="download-btn" id="downloadLink">下载生成的音频</a>
    </div>
  </div>
</div>

<script>
let audioBuffer = null;
let currentMode = 'concat';
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

// 模式切换函数 (修复核心)
function changeMode(mode) {
  currentMode = mode;
  // 移除所有按钮的 active 类
  document.getElementById('btnConcat').classList.remove('active');
  document.getElementById('btnOverlay').classList.remove('active');
  // 给当前点击的添加 active
  if(mode === 'concat') {
    document.getElementById('btnConcat').classList.add('active');
  } else {
    document.getElementById('btnOverlay').classList.add('active');
  }
}

// 文件上传
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');

uploadZone.onclick = () => fileInput.click();
fileInput.onchange = (e) => {
  const file = e.target.files[0];
  if (file) {
    document.getElementById('fileName').innerText = file.name;
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        audioBuffer = await audioCtx.decodeAudioData(ev.target.result);
        document.getElementById('processBtn').disabled = false;
      } catch (err) {
        alert("音频解析失败，请尝试换一个文件");
      }
    };
    reader.readAsArrayBuffer(file);
  }
};

// 核心处理逻辑
async function startProcessing() {
  if (!audioBuffer) return;

  const btn = document.getElementById('processBtn');
  const repeats = parseInt(document.getElementById('repeatSlider').value);
  const pitchShift = parseFloat(document.getElementById('pitchShift').value) || 0;
  
  // 禁用按钮防止重复点击
  btn.disabled = true;
  document.getElementById('progressArea').style.display = 'block';
  document.getElementById('downloadArea').style.display = 'none';

  // 计算播放速率 (音调)
  const playbackRate = Math.pow(2, pitchShift / 12);
  const adjustedDuration = audioBuffer.duration / playbackRate;
  const sampleRate = audioBuffer.sampleRate;
  const channels = audioBuffer.numberOfChannels;
  
  let totalDuration = (currentMode === 'concat') ? (adjustedDuration * repeats) : adjustedDuration;
  
  const offlineCtx = new OfflineAudioContext(channels, Math.ceil(totalDuration * sampleRate), sampleRate);
  
  const fill = document.getElementById('progressFill');

  for (let i = 0; i < repeats; i++) {
    const source = offlineCtx.createBufferSource();
    source.buffer = audioBuffer;
    source.playbackRate.value = playbackRate;

    if (currentMode === 'overlay') {
      const gain = offlineCtx.createGain();
      gain.gain.value = 1 / Math.sqrt(repeats); // 防止爆音
      source.connect(gain);
      gain.connect(offlineCtx.destination);
      source.start(0);
    } else {
      source.connect(offlineCtx.destination);
      source.start(i * adjustedDuration);
    }
    fill.style.width = ((i / repeats) * 60) + '%';
  }

  document.getElementById('progressText').innerText = "渲染音频中...";
  const renderedBuffer = await offlineCtx.startRendering();
  
  fill.style.width = '90%';
  document.getElementById('progressText').innerText = "导出 WAV...";
  
  const wavBlob = bufferToWav(renderedBuffer);
  const url = URL.createObjectURL(wavBlob);
  
  const dl = document.getElementById('downloadLink');
  dl.href = url;
  dl.download = `Subliminal_${currentMode}_p${pitchShift}.wav`;
  
  document.getElementById('progressArea').style.display = 'none';
  document.getElementById('downloadArea').style.display = 'block';
  btn.disabled = false; // 重新启用按钮
}

// WAV 编码辅助函数
function bufferToWav(buffer) {
  const numOfChan = buffer.numberOfChannels,
    length = buffer.length * numOfChan * 2 + 44,
    bufferArr = new ArrayBuffer(length),
    view = new DataView(bufferArr),
    channels = [], i, sample, offset = 0, pos = 0;

  function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
  function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

  setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157);
  setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan);
  setUint32(buffer.sampleRate); setUint32(buffer.sampleRate * 2 * numOfChan);
  setUint16(numOfChan * 2); setUint16(16);
  setUint32(0x61746164); setUint32(length - pos - 4);

  for(i=0; i<numOfChan; i++) channels.push(buffer.getChannelData(i));
  while(pos < length) {
    for(i=0; i<numOfChan; i++) {
      sample = Math.max(-1, Math.min(1, channels[i][offset]));
      sample = (sample < 0 ? sample * 0x8000 : sample * 0x7FFF);
      view.setInt16(pos, sample, true); pos += 2;
    }
    offset++;
  }
  return new Blob([bufferArr], {type: "audio/wav"});
}
</script>
</body>
</html>
