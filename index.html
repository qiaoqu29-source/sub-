<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ Subliminal Studio Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0a12;
    --surface: #13101c;
    --surface2: #1a1525;
    --border: rgba(200,170,255,0.12);
    --accent: #c8a8ff;
    --accent2: #f0c0e8;
    --accent3: #8fd0ff;
    --text: #e8e0f5;
    --muted: rgba(232,224,245,0.45);
    --glow: rgba(200,168,255,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 10%, rgba(120,80,200,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 80% 90%, rgba(200,100,180,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 40% 60% at 90% 20%, rgba(80,150,220,0.10) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 680px;
    margin: 0 auto;
    padding: 60px 24px 80px;
  }

  header { text-align: center; margin-bottom: 56px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--accent); opacity: 0.7; margin-bottom: 16px; }
  h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(42px, 8vw, 64px); font-weight: 300; background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 50%, var(--accent3) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 12px; }
  .subtitle { font-size: 14px; color: var(--muted); line-height: 1.6; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 36px; margin-bottom: 16px; position: relative; }
  .card-label { font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--accent); opacity: 0.6; margin-bottom: 20px; font-weight: 500; }

  .upload-zone { border: 1.5px dashed rgba(200,168,255,0.25); border-radius: 14px; padding: 40px 24px; text-align: center; cursor: pointer; transition: all 0.3s; background: rgba(200,168,255,0.02); }
  .upload-zone:hover { border-color: rgba(200,168,255,0.5); background: rgba(200,168,255,0.05); }
  .upload-icon { font-size: 32px; display: block; margin-bottom: 10px; }
  #fileInput { display: none; }
  .file-name { font-family: 'Cormorant Garamond', serif; font-size: 18px; color: var(--accent2); margin-top: 10px; font-style: italic; }

  .controls-grid { display: grid; gap: 32px; }
  .control-group label { display: block; font-size: 12px; color: var(--muted); letter-spacing: 0.08em; margin-bottom: 14px; text-transform: uppercase; }

  /* New Input Style for Pitch */
  .pitch-input-wrapper { display: flex; align-items: center; gap: 15px; }
  .num-input {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 15px;
    color: var(--accent);
    font-family: 'DM Sans', sans-serif;
    font-size: 18px;
    width: 100px;
    outline: none;
    transition: border-color 0.3s;
  }
  .num-input:focus { border-color: var(--accent); }
  .input-hint { font-size: 12px; color: var(--muted); }

  .mode-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mode-btn { padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; transition: 0.25s; }
  .mode-btn.active { border-color: var(--accent); background: rgba(200,168,255,0.08); color: var(--accent); }

  .slider-value { font-family: 'Cormorant Garamond', serif; font-size: 48px; color: var(--accent); line-height: 1; }
  input[type="range"] { -webkit-appearance: none; width: 100%; height: 3px; background: rgba(200,168,255,0.15); outline: none; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); cursor: pointer; }

  .process-btn { width: 100%; padding: 18px; border-radius: 14px; background: linear-gradient(135deg, rgba(180,130,255,0.15), rgba(100,170,255,0.1)); border: 1px solid rgba(200,168,255,0.35); color: var(--accent); font-family: 'Cormorant Garamond', serif; font-size: 20px; cursor: pointer; transition: 0.3s; }
  .process-btn:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-1px); }
  .process-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .progress-area { display: none; margin-top: 20px; }
  .progress-area.show { display: block; }
  .progress-bar-track { height: 3px; background: rgba(200,168,255,0.1); border-radius: 2px; overflow: hidden; margin-bottom: 10px; }
  .progress-bar-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }
  
  .download-area { display: none; text-align: center; margin-top: 20px; }
  .download-area.show { display: block; }
  .download-btn { display: inline-block; padding: 14px 32px; border-radius: 100px; background: rgba(200,168,255,0.2); border: 1px solid var(--accent); color: var(--text); text-decoration: none; transition: 0.3s; }
  
  .particle { position: fixed; width: 2px; height: 2px; background: var(--accent); pointer-events: none; animation: float-up linear infinite; }
  @keyframes float-up { 0% { opacity:0; transform:translateY(0); } 50% { opacity:0.5; } 100% { opacity:0; transform:translateY(-100px); } }
</style>
</head>
<body>

<div class="container">
  <header>
    <p class="eyebrow">✦ Audio Manifestation Tool</p>
    <h1>Subliminal<br>Studio</h1>
    <p class="subtitle">上传肯定语，调整音调，让频率与目标共振</p>
  </header>

  <div class="card">
    <p class="card-label">01 — 导入源文件</p>
    <div class="upload-zone" id="uploadZone">
      <input type="file" id="fileInput" accept="audio/*">
      <span class="upload-icon">✦</span>
      <p>点击或拖拽音频文件</p>
      <p class="file-name" id="fileName" style="display:none"></p>
    </div>
  </div>

  <div class="card">
    <p class="card-label">02 — 调节参数</p>
    <div class="controls-grid">
      
      <div class="control-group">
        <label>音调调整 (半音)</label>
        <div class="pitch-input-wrapper">
          <input type="number" id="pitchShift" class="num-input" value="0" step="1">
          <div class="input-hint">
            正数提升音调，负数降低音调<br>
            <span style="opacity:0.6; font-size:11px;">* 12个半音为一个八度</span>
          </div>
        </div>
      </div>

      <div class="control-group">
        <label>重复次数</label>
        <div class="slider-display" style="display:flex; align-items:baseline; gap:10px; margin-bottom:10px;">
          <span class="slider-value" id="repeatVal">10</span>
          <span style="color:var(--muted)">次</span>
        </div>
        <input type="range" id="repeatSlider" min="1" max="100" value="10" oninput="document.getElementById('repeatVal').textContent=this.value">
      </div>

      <div class="control-group">
        <label>处理模式</label>
        <div class="mode-toggle">
          <button class="mode-btn active" id="btnConcat" onclick="setMode('concat')">🔗 顺序拼接</button>
          <button class="mode-btn" id="btnOverlay" onclick="setMode('overlay')">✦ 同步叠加</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <p class="card-label">03 — 生成结果</p>
    <button class="process-btn" id="processBtn" disabled onclick="processAudio()">✦ 开始处理音频</button>
    
    <div class="progress-area" id="progressArea">
      <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>
      <p id="progressText" style="font-size:12px; text-align:center; color:var(--muted);">准备中...</p>
    </div>

    <div class="download-area" id="downloadArea">
      <p style="font-family:'Cormorant Garamond',serif; font-style:italic; margin-bottom:15px;">处理完成</p>
      <a class="download-btn" id="downloadLink">⬇ 下载 WAV 音频</a>
    </div>
  </div>
</div>

<script>
let audioBuffer = null;
let currentMode = 'concat';
let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function setMode(mode) {
  currentMode = mode;
  document.getElementById('btnConcat').classList.toggle('active', mode === 'concat');
  document.getElementById('btnOverlay').classList.toggle('active', mode === 'overlay');
}

// File Handling
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');

uploadZone.onclick = () => fileInput.click();
fileInput.onchange = (e) => {
  const file = e.target.files[0];
  if (file) {
    document.getElementById('fileName').textContent = file.name;
    document.getElementById('fileName').style.display = 'block';
    const reader = new FileReader();
    reader.onload = async (ev) => {
      audioBuffer = await audioCtx.decodeAudioData(ev.target.result);
      document.getElementById('processBtn').disabled = false;
    };
    reader.readAsArrayBuffer(file);
  }
};

// Processing Logic
async function processAudio() {
  if (!audioBuffer) return;

  const repeats = parseInt(document.getElementById('repeatSlider').value);
  const pitchShift = parseFloat(document.getElementById('pitchShift').value);
  
  // 计算播放速率: rate = 2^(semitones/12)
  const playbackRate = Math.pow(2, pitchShift / 12);
  
  // 因为音调改变，单次循环的持续时间也会改变
  const adjustedDuration = audioBuffer.duration / playbackRate;
  
  const sampleRate = audioBuffer.sampleRate;
  const channels = audioBuffer.numberOfChannels;
  
  let totalDuration = currentMode === 'concat' ? adjustedDuration * repeats : adjustedDuration;
  
  const offlineCtx = new OfflineAudioContext(channels, Math.ceil(totalDuration * sampleRate), sampleRate);
  
  document.getElementById('processArea').classList.add('show');
  document.getElementById('downloadArea').classList.remove('show');
  const fill = document.getElementById('progressFill');

  for (let i = 0; i < repeats; i++) {
    const source = offlineCtx.createBufferSource();
    source.buffer = audioBuffer;
    source.playbackRate.value = playbackRate; // 设置音调/速率

    if (currentMode === 'overlay') {
      const gain = offlineCtx.createGain();
      gain.gain.value = 1 / Math.sqrt(repeats); // 防止叠加爆音
      source.connect(gain);
      gain.connect(offlineCtx.destination);
      source.start(0);
    } else {
      source.connect(offlineCtx.destination);
      source.start(i * adjustedDuration);
    }
    
    fill.style.width = ((i+1)/repeats * 50) + '%';
  }

  document.getElementById('progressText').textContent = "正在渲染高品质音频...";
  const renderedBuffer = await offlineCtx.startRendering();
  
  fill.style.width = '100%';
  document.getElementById('progressText').textContent = "编码中...";
  
  const wavBlob = bufferToWav(renderedBuffer);
  const url = URL.createObjectURL(wavBlob);
  
  document.getElementById('downloadLink').href = url;
  document.getElementById('downloadLink').download = `sub_pitch${pitchShift}_x${repeats}.wav`;
  document.getElementById('downloadArea').classList.add('show');
  document.getElementById('progressArea').classList.remove('show');
}

// WAV Encoder Helper
function bufferToWav(buffer) {
  const numOfChan = buffer.numberOfChannels,
    length = buffer.length * numOfChan * 2 + 44,
    bufferArr = new ArrayBuffer(length),
    view = new DataView(bufferArr),
    channels = [], i, sample, offset = 0, pos = 0;

  function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
  function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

  setUint32(0x46464952); // "RIFF"
  setUint32(length - 8); 
  setUint32(0x45564157); // "WAVE"
  setUint32(0x20746d66); // "fmt "
  setUint32(16); setUint16(1); setUint16(numOfChan);
  setUint32(buffer.sampleRate); setUint32(buffer.sampleRate * 2 * numOfChan);
  setUint16(numOfChan * 2); setUint16(16);
  setUint32(0x61746164); // "data"
  setUint32(length - pos - 4);

  for(i=0; i<numOfChan; i++) channels.push(buffer.getChannelData(i));
  while(pos < length) {
    for(i=0; i<numOfChan; i++) {
      sample = Math.max(-1, Math.min(1, channels[i][offset]));
      sample = (sample < 0 ? sample * 0x8000 : sample * 0x7FFF);
      view.setInt16(pos, sample, true); pos += 2;
    }
    offset++;
  }
  return new Blob([bufferArr], {type: "audio/wav"});
}

// Visual Particles
setInterval(() => {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = Math.random() * 100 + 'vw';
  p.style.bottom = '10%';
  p.style.animationDuration = (2 + Math.random() * 3) + 's';
  document.body.appendChild(p);
  setTimeout(() => p.remove(), 5000);
}, 300);
</script>

</body>
</html>
